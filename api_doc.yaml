openapi: 3.0.3
info:
    title: meta_tech
    version: 1.0.0
    contact: {}
    description: |-
        - api for shop. 
        - (admin account: email = admin@gmail.com, password = 123aaaaa)
servers:
    - url: 'http://localhost:4000'
paths:
    /api/user/forgot-password:
        post:
            tags:
                - Forgot password API
            summary: forgot password
            description: send a link(include forgot password token) into user's email
            operationId: forgotPassword
            requestBody:
                content:
                    application/x-www-form-urlencoded:
                        schema:
                            type: object
                            properties:
                                email:
                                    type: string
                                    example: darknessclmm@gmail.com
                        examples:
                            forgot password:
                                value:
                                    email: darknessclmm@gmail.com
            responses:
                '200':
                    description: ''
    /api/user/verify-forgot-password:
        post:
            tags:
                - Forgot password API
            summary: verify forgotpassword token
            description: verify forgotpassword token when click on the link sent on email
            operationId: verifyForgotpasswordToken
            requestBody:
                content:
                    application/x-www-form-urlencoded:
                        schema:
                            type: object
                            properties:
                                '':
                                    type: string
                                    example: >-
                                        note: sau mà dùng api này thì tạo 1 trang
                                        http://localhost:3000/verify_forgot_password_token?forgot_password_token=eyJhbGciOiJIUzI1......
                                        để verify
                                forgot_password_token:
                                    type: string
                                    example: >-
                                        eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySUQiOjMsInJvbGUiOiJjdXN0b21lciIsImlhdCI6MTY5NzA5NDc0OSwiZXhwIjoxNjk3MjY3NTQ5fQ.rhS6dpv3sn3we5twtIADCwjMyCl1QcRdVDyiKjnIHu4
                        examples:
                            verify forgotpassword token:
                                value:
                                    '': >-
                                        note: sau mà dùng api này thì tạo 1 trang
                                        http://localhost:3000/verify_forgot_password_token?forgot_password_token=eyJhbGciOiJIUzI1......
                                        để verify
                                    forgot_password_token: >-
                                        eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySUQiOjMsInJvbGUiOiJjdXN0b21lciIsImlhdCI6MTY5NzA5NDc0OSwiZXhwIjoxNjk3MjY3NTQ5fQ.rhS6dpv3sn3we5twtIADCwjMyCl1QcRdVDyiKjnIHu4
