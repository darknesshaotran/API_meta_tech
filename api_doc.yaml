                content:
                    application/x-www-form-urlencoded:
                        schema:
                            type: object
                            properties:
                                confirm_password:
                                    type: string
                                    example: 123aaaaa
                                email:
                                    type: string
                                    example: darknessclmm@gmail.com
                                forgot_password_token:
                                    type: string
                                    example: >-
                                        eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySUQiOjIsInR5cGUiOiJmb3Jnb3RQYXNzd29yZFRva2VuIiwiaWF0IjoxNjk3MDM4NzQ4LCJleHAiOjE2OTcyMTE1NDh9.SJaeS5DoXJE-fOtEn9y5vy1vNz9dq6jI1fkaOgpvsKw
